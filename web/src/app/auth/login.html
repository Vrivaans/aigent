<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🤖</div>
      <h1>AIgent Login</h1>
      <p>{{ t('login.access_restricted') }}</p>
    </div>

    <form (submit)="onLogin()">
      <div class="form-group">
        <label>{{ t('login.username') }}</label>
        <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" [placeholder]="t('login.username_placeholder')" autocomplete="username">
      </div>

      <div class="form-group">
        <label>{{ t('login.password') }}</label>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="error-msg" *ngIf="error()">
        {{ error() }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">{{ t('login.btn_login') }}</span>
        <span *ngIf="isLoading()" class="spinner-small"></span>
      </button>
    </form>
  </div>
</div>
